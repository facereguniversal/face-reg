<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oakridge Academy - Student Check-In</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b4f91'/%3E%3Ccircle cx='32' cy='25' r='11' fill='white'/%3E%3Cpath d='M14 55c3-12 10-18 18-18s15 6 18 18' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/checkin/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="kiosk-container">
        <div class="header">
            <h1>Oakridge Academy</h1>
            <p>Student Check-In Kiosk</p>
        </div>
        
        <div class="scanner-interface">
            <video id="webcam" autoplay playsinline></video>
            <div class="scanner-overlay" id="scanner-overlay">
                <div class="scan-line"></div>
            </div>
            
            <div class="status-panel" id="status-panel">
                <span id="status-text">Scanning for Student...</span>
            </div>
        </div>

        <div class="success-card hidden" id="success-card">
            <div class="check-icon">✓</div>
            <h2>Welcome to School, <span id="student-name">Student</span>! 👋</h2>
            <p class="student-detail">Class: <strong id="student-class">Grade 10-A</strong></p>
            <p class="checkin-time">Time: <span id="checkin-time"></span></p>
            <p class="subtitle">Attendance verified. Have a fantastic day!</p>
        </div>
    </div>
    
    <script src="/checkin/app.js"></script>
</body>
</html>
