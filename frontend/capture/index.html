<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Capture – Enrollment</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b4f91'/%3E%3Ccircle cx='32' cy='25' r='11' fill='white'/%3E%3Cpath d='M14 55c3-12 10-18 18-18s15 6 18 18' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/capture/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>School Attendance System</h1>
      <p>Student Biometric Registration</p>
    </header>
    
    <main class="capture-container">
      <div id="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div id="face-guide"></div>
      </div>
      
      <div id="feedback-panel" class="hidden">
        <span id="feedback-icon"></span>
        <span id="feedback-text">Position student face inside the frame</span>
      </div>

      <div class="controls">
        <button id="capture-btn" disabled>Capture Frame</button>
      </div>
    </main>

    <aside class="gallery-container">
      <div class="student-info-form">
        <h3>Student Information</h3>
        <div class="form-group">
          <label for="student-name">Full Name</label>
          <input type="text" id="student-name" placeholder="e.g. Alex Smith" value="Alex Smith" required />
        </div>
        <div class="form-group">
          <label for="student-class">Class / Grade</label>
          <input type="text" id="student-class" placeholder="e.g. Grade 10-A" value="Grade 10-A" required />
        </div>
      </div>

      <h2>Captured Frames (<span id="frame-count">0</span>/6)</h2>
      <div id="gallery"></div>
      <button id="submit-btn" disabled>Complete Registration</button>
    </aside>
  </div>

  <script src="/capture/app.js?v=20260728-1"></script>
</body>
</html>
