<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-In Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="admin-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Lumiere Hotels</p>
        <h1>Live Check-Ins</h1>
      </div>
      <div class="connection" id="connection">Connecting</div>
    </header>

    <section class="content-grid">
      <section class="feed-panel">
        <div class="section-head">
          <h2>Recent Activity</h2>
          <button id="refresh-btn" type="button">Refresh</button>
        </div>
        <ol id="feed" class="feed"></ol>
      </section>

      <aside class="override-panel">
        <h2>Manual Override</h2>
        <label>
          Search
          <input id="user-query" type="search" autocomplete="off" placeholder="Name or email" />
        </label>
        <div id="user-results" class="user-results"></div>
        <label>
          Device
          <input id="device-input" value="front-desk" />
        </label>
        <label>
          Reason
          <textarea id="reason-input" rows="4" placeholder="Optional"></textarea>
        </label>
        <button id="manual-btn" disabled>Record Manual Check-In</button>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
