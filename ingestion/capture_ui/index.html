<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Capture – Enrollment</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Face Recognition</h1>
      <p>Secure Biometric Enrollment</p>
    </header>
    
    <main class="capture-container">
      <div id="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div id="face-guide"></div>
      </div>
      
      <div id="feedback-panel" class="hidden">
        <span id="feedback-icon"></span>
        <span id="feedback-text">Position your face inside the frame</span>
      </div>

      <div class="controls">
        <button id="capture-btn" disabled>Capture Frame</button>
      </div>
    </main>

    <aside class="gallery-container">
      <h2>Captured Frames (<span id="frame-count">0</span>/6)</h2>
      <div id="gallery"></div>
      <button id="submit-btn" disabled>Complete Enrollment</button>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
