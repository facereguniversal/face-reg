<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In Kiosk</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="kiosk-shell" data-state="idle">
        <header class="kiosk-header">
            <p class="eyebrow">Lumiere Hotels</p>
            <h1>Guest Check-In</h1>
        </header>

        <section class="camera-stage" aria-live="polite">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div class="state-wash" id="state-wash"></div>
            <div class="status-strip">
                <span class="status-dot"></span>
                <span id="status-text">Please step forward</span>
            </div>
            <div class="spinner" id="spinner"></div>
        </section>

        <section class="result-panel" id="result-panel" hidden>
            <p id="result-title">Welcome</p>
            <h2 id="guest-name"></h2>
            <span id="guest-role"></span>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
