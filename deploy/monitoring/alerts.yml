groups:
  - name: face-reg
    rules:
      - alert: ApiHealthDegraded
        expr: up{job="face-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Face API is unreachable
          description: Prometheus cannot scrape the API /metrics endpoint for 2 minutes.

      - alert: ModelServerDown
        expr: up{job="face-model-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Model server is unreachable
          description: Prometheus cannot scrape the model server for 2 minutes.

      - alert: HighCheckin5xxRate
        expr: |
          sum(rate(http_requests_total{handler="/api/checkin",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{handler="/api/checkin"}[5m]))
          > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated 5xx rate on check-in endpoint
