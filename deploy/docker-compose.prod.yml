# Production overrides — use with the base compose file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.production up -d --build

services:
  db:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-facedb}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      BOOTSTRAP_ON_STARTUP: "false"
      ENABLE_DEMO_UI: ${ENABLE_DEMO_UI:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.production}
      MODEL_SERVER_URL: ${MODEL_SERVER_URL:-http://model_server:8001}
      CHECKIN_DEVICE_TOKENS: ${CHECKIN_DEVICE_TOKENS:?set CHECKIN_DEVICE_TOKENS in .env.production}
      CHECKIN_SIMILARITY_THRESHOLD: ${CHECKIN_SIMILARITY_THRESHOLD:-0.6}
      CHECKIN_COOLDOWN_SECONDS: ${CHECKIN_COOLDOWN_SECONDS:-300}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env.production}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.6}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.error, urllib.request;\\ntry:\\n r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)\\nexcept urllib.error.HTTPError as e:\\n r=e\\nexit(0 if r.status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  model_server:
    environment:
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.5}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_healthy
      model_server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
