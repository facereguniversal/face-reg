apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: face-reg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: face-reg-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DATABASE_URL
            - name: MODEL_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: MODEL_SERVER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: face-secrets
                  key: SECRET_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: face-reg
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
