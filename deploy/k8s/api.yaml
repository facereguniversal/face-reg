apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: face-reg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          image: face-reg-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DATABASE_URL
            - name: MODEL_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: MODEL_SERVER_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: face-secrets
                  key: SECRET_KEY
            - name: REDIS_URL
              value: "redis://redis.face-reg.svc.cluster.local:6379/0"
            - name: CHECKIN_DEVICE_TOKENS
              value: "demo-kiosk:demo-token"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: face-reg
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
