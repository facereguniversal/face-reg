apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: face-reg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: model-server
      containers:
        - name: model-server
          image: face-reg-model:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # Removed FAISS env and volumes
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: face-reg
spec:
  selector:
    app: model-server
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
