services:
  # -----------------------------------------------------------------------
  # PostgreSQL
  # -----------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faceuser
      POSTGRES_PASSWORD: facepass
      POSTGRES_DB: facedb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceuser -d facedb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------
  # API Service (FastAPI)
  # -----------------------------------------------------------------------
  api:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      model_server:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://faceuser:facepass@db:5432/facedb"
      SECRET_KEY: "local-dev-secret-change-in-prod"
      MODEL_SERVER_URL: "http://model_server:8001"
      CHECKIN_DEVICE_TOKENS: "demo-kiosk:demo-token"
      CHECKIN_SIMILARITY_THRESHOLD: "0.6"
      CHECKIN_COOLDOWN_SECONDS: "300"
      ENVIRONMENT: development
      ENABLE_DEMO_UI: "true"
      BOOTSTRAP_ON_STARTUP: "true"
      BOOTSTRAP_ADMIN_NAME: "Demo Admin"
      BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
      BOOTSTRAP_ADMIN_PASSWORD: "adminpass"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------
  # Model Server (ML inference + FAISS)
  # -----------------------------------------------------------------------
  model_server:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.model
    restart: unless-stopped
    environment:
      FAISS_INDEX_PATH: /data/faiss.index
      FAISS_MAP_PATH: /data/faiss_id_map.json
      LIVENESS_THRESHOLD: "0.5"
    volumes:
      - model_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  model_data:
