name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black flake8
      - run: black --check api/ model_server/ tests/
      - run: flake8 api/ model_server/ tests/ --max-line-length 120

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faceuser
          POSTGRES_PASSWORD: facepass
          POSTGRES_DB: facedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceuser -d facedb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: PYTHONPATH=. pytest tests/api_tests.py tests/audit_tests.py tests/model_tests.py -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret"

  test-model:
    name: Model Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install opencv-python-headless numpy
      - run: pip install -r model_server/requirements.txt || true
      - run: PYTHONPATH=. pytest tests/model_tests.py -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-api, test-model]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t face-api:ci .
      - run: docker build -f deploy/Dockerfile.model -t face-model:ci .
