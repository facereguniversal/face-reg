name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend-railway:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy Backend Service
        run: |
          if ! railway up --service face-reg; then
            railway logs --service face-reg --latest --deployment --lines 200 || true
            exit 1
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify Backend Routes
        run: |
          curl --fail --retry 12 --retry-delay 5 \
            https://face-reg-production.up.railway.app/api/health
          curl --fail --retry 12 --retry-delay 5 \
            https://face-reg-production.up.railway.app/openapi.json \
            | grep -q '"/api/faces/enroll"'

  deploy-frontend-vercel:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Frontend Deployment
        run: |
          curl --fail --retry 12 --retry-delay 5 \
            https://face-reg-nu.vercel.app/capture/app.js \
            | grep -q '/users/${USER_ID}/faces'
