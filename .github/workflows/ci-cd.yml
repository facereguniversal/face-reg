name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Run linting
        run: |
          black --check api model_server
          ruff check api model_server

      - name: Run tests
        run: |
          pytest tests/ --cov=api --cov-report=xml

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest

      - name: Build and push Model image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.model
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy to Kubernetes
        run: |
          # Update image tags
          sed -i "s|image: face-reg-api:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}|g" deploy/k8s/api.yaml
          sed -i "s|image: face-reg-model:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-model:${{ github.sha }}|g" deploy/k8s/model-server.yaml
          
          # Apply manifests
          kubectl apply -f deploy/k8s/
          
          # Restart deployments to ensure new images are pulled if tags are identical
          kubectl rollout restart deployment/api -n face-reg
          kubectl rollout restart deployment/model-server -n face-reg
