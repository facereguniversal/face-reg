name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black flake8
      - run: black --check api model_server tests
      - run: flake8 api model_server tests --max-line-length 120

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: PYTHONPATH=. pytest -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret"
          CHECKIN_DEVICE_TOKENS: "demo-kiosk:demo-token"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t face-api:ci .
      - run: docker build -f deploy/Dockerfile.model -t face-model:ci .

  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config
      - name: Prepare production env for compose config
        run: |
          cp deploy/.env.production.example deploy/.env.production
          SECRET_KEY=$(openssl rand -hex 32)
          DB_PASS=$(openssl rand -hex 16)
          KIOSK_TOKEN=$(openssl rand -hex 24)
          GRAFANA_PASS=$(openssl rand -hex 16)
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=${SECRET_KEY}/" deploy/.env.production
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${DB_PASS}/" deploy/.env.production
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://faceuser:${DB_PASS}@db:5432/facedb|" deploy/.env.production
          sed -i "s/^CHECKIN_DEVICE_TOKENS=.*/CHECKIN_DEVICE_TOKENS=kiosk-ci:${KIOSK_TOKEN}/" deploy/.env.production
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASS}/" deploy/.env.production
          sed -i "s/^DOMAIN=.*/DOMAIN=localhost/" deploy/.env.production
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=https://localhost|" deploy/.env.production
      - run: deploy/scripts/validate-env.sh deploy/.env.production
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config
